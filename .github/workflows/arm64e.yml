name: arm64e build

on:
  workflow_dispatch:
    inputs:
      race:
        description: 'Compile armed IOSurface and IOAudioCodecs probes'
        type: boolean
        default: false
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos + SDK
        run: |
          git clone --depth=1 --recurse-submodules --shallow-submodules https://github.com/theos/theos.git /Users/runner/theos
          mkdir -p /Users/runner/theos/sdks
          curl -sL "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz" -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C /Users/runner/theos/sdks
          mkdir -p /Users/runner/theos/bin && curl -sL https://raw.githubusercontent.com/theos/dm.pl/master/dm.pl -o /Users/runner/theos/bin/dm.pl && chmod +x /Users/runner/theos/bin/dm.pl
          brew install ldid

      - name: Build KexProofV3 (arm64e)
        working-directory: .
        env:
          THEOS: /Users/runner/theos
        run: |
          if [ "${{ inputs.race }}" = "true" ]; then
            sed -i '' 's/^KexProofV3_CFLAGS = /KexProofV3_CFLAGS = -DKP_IOSURFACE27_ENABLE_RACE=1 -DKP_IOAUDIO27_ENABLE_ARMED=1 /' Makefile
          fi
          make package FINALPACKAGE=1 THEOS="$THEOS"

      - name: Sign + package IPA
        working-directory: .
        run: |
          BIN="$(find .theos/_ -path '*/KexProofV3.app/KexProofV3' -type f | head -1)"
          test -f "$BIN"
          python3 - "$BIN" <<'EOF'
          import struct, sys
          p = sys.argv[1]
          d = bytearray(open(p,'rb').read())
          cputype, subtype = struct.unpack('<II', d[4:12])
          if cputype == 0x100000C and subtype != 0x80000002:
              struct.pack_into('<I', d, 8, 0x80000002)
              open(p,'wb').write(d)
          EOF
          mkdir -p out/Payload
          cp -R "$(dirname "$BIN")" out/Payload/
          ldid -SResources/entitlements.plist "$BIN" || true
          IPA=KexProofV3-arm64e.ipa
          if [ "${{ inputs.race }}" = "true" ]; then IPA=KexProofV3-arm64e-race.ipa; fi
          (cd out && zip -qr "$IPA" Payload)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.race && 'KexProofV3-arm64e-race' || 'KexProofV3-arm64e' }}
          path: out/*.ipa
